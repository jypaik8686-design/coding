function onPress(code){
  syncInputTimeline();activateFeedback();
  if(state==='title'){ if(code==='KeyM'){toggleMute();return;} startGame(); return; }
  if(state==='gameover'||state==='victory'){
    if(code==='KeyM'){toggleMute();return;}
    if(code==='KeyR'||code==='Enter'||code==='click'||code==='parryClick'||code==='chargeClick') initGame();
    return;
  }
  if(code==='KeyM'){ toggleMute(); return; }
  if(state!=='fight') return;
  if(code==='Space'||code==='KeyJ'||code==='parryClick') tryParry();
  else if(code==='KeyF'||code==='KeyK'||code==='chargeClick') startCharge();
  else if(code==='KeyW'||code==='ArrowUp') dashCheck('up');
  else if(code==='KeyS'||code==='ArrowDown') dashCheck('down');
  else if(code==='KeyA'||code==='ArrowLeft') dashCheck('left');
  else if(code==='KeyD'||code==='ArrowRight') dashCheck('right');
}
function dashCheck(dir){
  if(keys.ShiftLeft||keys.ShiftRight||keys.ShiftLeft===undefined&&false){}
  if(keys.ShiftLeft||keys.ShiftRight){ if(dir==='up')dashRelative(0,-1); if(dir==='down')dashRelative(0,1); if(dir==='left')dashRelative(-1,0); if(dir==='right')dashRelative(1,0); return; }
  if(dir===lastTapDir&&inputTimelineTime()-lastTapT<0.25){
    if(dir==='up')dashRelative(0,-1); if(dir==='down')dashRelative(0,1); if(dir==='left')dashRelative(-1,0); if(dir==='right')dashRelative(1,0);
    lastTapT=-9; return;
  }
  lastTapDir=dir; lastTapT=inputTimelineTime();
}

const easeMotion=q=>{q=clamp(q,0,1);return q*q*(3-2*q);};

 yuk:{coil:1.05,hip:.23,step:.13,crouch:.16,elbow:.92,wrist:.10,guard:-.66},

 else if(f.state==='strike'){const t=clamp(f.t,0,motion.end),launch=c-motion.sweep;gather=1;cut=t<=c?.68*Math.pow(clamp((t-launch)/motion.sweep,0,1),2.25):.68+.32*easeMotion((t-c)/(motion.end-c));}

 motionSample.gather=gather;motionSample.cut=cut;return motionSample;
}
function gaitStep(t){return t<.62?.36-.72*easeMotion(t/.62):-.36+.72*easeMotion((t-.62)/.38);}
function gaitKnee(t){return .09+(t<.62?.035*Math.sin(t/.62*Math.PI):.56*Math.sin((t-.62)/.38*Math.PI));}

martialMix.phase=0;
/* Pose family crossfade. State transitions ride a .15s blend from the exact
   previous-frame pose, so walk→windup continues from wherever the body was
   instead of snapping back to the base stance. Judgement is untouched: the
   trajectory cache samples poseSculpted with a synthetic fighter (never the
   live `enemy` object), so cached contact geometry, parry markers and damage
   stay byte-identical while only the live view blends. */

function poseBlendApply(rig,k){

  for(let i=0;i<nodes.length;i++){const r=nodes[i].rotation;r.x=buf[i*3]+(r.x-buf[i*3])*k;r.y=buf[i*3+1]+(r.y-buf[i*3+1])*k;r.z=buf[i*3+2]+(r.z-buf[i*3+2])*k;}

function step(dt,rdt){
  contextHintT=Math.max(0,contextHintT-rdt);
   shakeT=Math.max(0,shakeT-rdt); if(shakeT<=0) shakeMag=0;
  flashT=Math.max(0,flashT-rdt);
  zoomT=Math.max(0,zoomT-rdt*0.8);
  if(banner) banner.t+=rdt;
  for(let i=fxDom.length-1;i>=0;i--){ fxDom[i].t+=rdt; if(fxDom[i].t>=fxDom[i].dur) fxDom.splice(i,1); }
  if(state==='fight'||state==='title'){
    if(dt>0){updatePlayer(dt);updateEnemy(dt);updateProjectiles(dt);updateSuppression(dt);updateTimingAssist(dt);if(!player.dead&&enemy.state!=='dead'){updatePosture(dt);updateInkPower(dt);}}
    separateFighters();
    updParticles(dt);
    if(!player.dead&&player.hp<=0){ player.hp=0; playerDie(); }
    if(enemy.hp<=0&&enemy.state!=='dead'){ enemy.hp=0; enemyDie(); }
    if(state==='fight'&&!player.dead&&enemy.state!=='dead'&&T-lastEventT>BALANCE.WATCHDOG){
      enemy.pending=null; enemy.queue=[]; enemy.punish=false;
      enemy.state='idle'; enemy.t=0.01; mark();
    }
  } else updParticles(rdt);
  clampArena(player);clampArena(enemy);
   if(demo&&state==='title'){
    if(enemy.state==='strike'&&!enemy.resolved&&enemy.t>=0.062) doParry();
    if((enemy.state==='stagger'||enemy.state==='offbalance')&&player.thrustCd<=0&&!player.thrust) doThrust();
  }
  if(state==='fight'&&introT>0){introT-=dt;if(introT<=0)hintOnce('move','칼이 들어올 때 패링');}
  if(state==='fight'&&!player.dead&&player.hp<=30){ hbT-=rdt; if(hbT<=0){ hbT=0.95; sfxHeart(); } }
}
let scrShown='title';
const FIXED_STEP=1/60,MAX_SUBSTEPS=8;
let last=performance.now(),accumulator=0,clockPaused=false,clockRunning=false;
function resetFrameClock(){last=performance.now();accumulator=0;}
function inputTimelineTime(){const frozen=Math.min(hitstopT,accumulator);return T+Math.max(0,accumulator-frozen)*(slowT>0?.72:1);}
function syncInputTimeline(){if(!clockRunning)advanceTimeline(performance.now());}
function advanceTimeline(now){
 if(clockRunning)return 0;clockRunning=true;
 const elapsed=Math.max(0,(now-last)/1000);last=now;
 if(document.hidden||clockPaused){accumulator=0;clockRunning=false;return 0;}
 accumulator=Math.min(FIXED_STEP*MAX_SUBSTEPS,accumulator+elapsed);
 let updates=0,simulated=0;
 while(accumulator+1e-9>=FIXED_STEP&&updates<MAX_SUBSTEPS){
  accumulator=Math.max(0,accumulator-FIXED_STEP);updates++;
  const frozen=Math.min(hitstopT,FIXED_STEP);hitstopT=Math.max(0,hitstopT-frozen);
  const available=FIXED_STEP-frozen,slowed=Math.min(slowT,available);slowT=Math.max(0,slowT-available);
  const dt=available-slowed*.28;T+=dt;simulated+=dt;step(dt,FIXED_STEP);
 }
 clockRunning=false;return simulated;
}
function loop(now){
 requestAnimationFrame(loop);const frameInterval=Math.max(0,now-last);if(R3)R3.frameInterval=frameInterval;
 // A contact pose survives all substeps until this render, not one unseen substep.
 if(hitstopT<=0)enemy.impactPose=null;
 const dt=advanceTimeline(now);if(document.hidden||clockPaused)return;

let THREE_OK=false;
try{ if(window.THREE&&window.THREE.WebGLRenderer){ R3=buildWorld(); THREE_OK=true; } }catch(e){ R3=null; THREE_OK=false; console.error(e); document.getElementById('err').textContent='화면 초기화 오류: '+e.message; }
if(!THREE_OK) document.getElementById('err').style.display='block';
player.x=-2.6; enemy.x=2.6;
startRound(0); state='title'; demo=true;
showScreen('title');
if(R3&&typeof R3.renderer.compile==='function'){
 let warmIndex=0;const scheduleWarm=()=>{if(window.requestIdleCallback)requestIdleCallback(warm,{timeout:1500});else setTimeout(warm,120);};
 const warm=()=>{if(document.hidden||state!=='title'||warmIndex>=ROUNDS.length)return;const rig=R3.E.rigs[ROUNDS[warmIndex++].spr],previous=R3.E.rig;const visible=rig.human.visible;if(previous)previous.human.visible=false;rig.human.visible=true;R3.renderer.compile(R3.scene,R3.camera);rig.human.visible=visible;if(previous)previous.human.visible=true;if(warmIndex<ROUNDS.length)scheduleWarm();};scheduleWarm();
}
requestAnimationFrame(loop);
</script>
