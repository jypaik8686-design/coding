<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17140f">
<meta name="mobile-web-app-capable" content="yes">
<title>아르곤 RP</title>
<style>
:root{
  --bg:#17140f; --panel:#211d17; --panel2:#2a251d; --line:#3a3328; --text:#ece6da; --dim:#a39a8a;
  --accent:#d9a55b; --accent2:#8fb3a3; --user:#2f2a22; --char:#1f1b15; --danger:#d9705b; --quote:#e8c98f;
  --radius:14px; --fs:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:var(--fs)/1.65 -apple-system,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
header .title{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
header .title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
header .title small{color:var(--dim);font-size:12px;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{background:none;border:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--text)}
.icon:active{background:var(--panel2)}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--panel2);flex:none;display:grid;place-items:center;font-size:15px;color:var(--accent);overflow:hidden}
#msgs{flex:1;overflow-y:auto;padding:14px 12px 20px;scroll-behavior:smooth}
.msg{margin:0 0 14px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.bubble{max-width:92%;padding:10px 14px;border-radius:var(--radius);background:var(--char);border:1px solid var(--line);word-break:break-word}
.msg.user .bubble{background:var(--user);border-color:#463e31}
.bubble p{margin:0 0 .55em}.bubble p:last-child{margin:0}
.bubble em{color:var(--dim);font-style:italic}
.bubble q{color:var(--quote);quotes:none}
.bubble.err{border-color:var(--danger);color:#f3c3b8;font-size:14px}
.name{font-size:12px;color:var(--dim);margin:0 4px 3px}
.tools{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;align-items:center}
.tools button{background:none;border:0;color:var(--dim);font-size:13px;padding:6px 8px;border-radius:8px}
.tools button:active{background:var(--panel2)}
.tools .sw{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;padding:0 2px}
.imgs{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-width:92%}
.imgs figure{margin:0;position:relative}
.imgs img{width:100%;border-radius:12px;display:block;background:var(--panel2)}
.imgs figure button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border:0;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
footer{border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--bg)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;max-height:40vh;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.composer textarea:focus{border-color:var(--accent)}
.send{width:46px;height:46px;border-radius:12px;border:0;background:var(--accent);color:#1b1610;font-size:20px;font-weight:700;flex:none}
.send.stop{background:var(--danger);color:#fff}
.quick{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.quick button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:60px 20px;font-size:15px}
.empty button{margin-top:14px}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--panel);z-index:21;transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#drawer.on{transform:none}
#drawer .dh{padding:14px 16px 6px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:space-between}
#drawer .ds{overflow-y:auto;flex:1;padding:0 8px 20px}
.sec{color:var(--dim);font-size:12px;margin:16px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.sec button{background:none;border:0;color:var(--accent);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;border:0;background:none;width:100%;text-align:left}
.row:active,.row.on{background:var(--panel2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
#sheet.on{display:flex}
#sheet .box{background:var(--panel);width:100%;max-width:720px;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet .sh{display:flex;align-items:center;padding:12px 8px 8px 16px;font-weight:700;font-size:17px}
#sheet .sh span{flex:1}
#sheet .sb{overflow-y:auto;padding:4px 16px 12px}
#sheet .sf{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:15px}
.btn.pri{background:var(--accent);color:#1b1610;border-color:var(--accent);font-weight:700}
.btn.dng{color:var(--danger)}
.btn.full{flex:1}
label.f{display:block;margin:12px 0}
label.f>span{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
label.f>em{display:block;font-size:12px;color:var(--dim);font-style:normal;margin-top:4px;opacity:.85}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
.inp:focus{border-color:var(--accent)}
.inp.secret{-webkit-text-security:disc;text-security:disc;font-family:monospace}
.grp{border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin:12px 0}
.grp>h4{margin:12px 0 0;font-size:14px;color:var(--accent)}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--dim);margin:6px 0}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--dim);margin-left:6px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.av-edit{display:flex;align-items:center;gap:12px}
.av-edit .avatar{width:64px;height:64px;font-size:24px}
#viewer{position:fixed;inset:0;background:#000;z-index:50;display:none;align-items:center;justify-content:center}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="bMenu" aria-label="메뉴">☰</button>
    <div class="title" id="hTitle"></div>
    <button class="icon" id="bChatMenu" aria-label="대화 메뉴">⋯</button>
  </header>
  <main id="msgs"></main>
  <footer>
    <div class="quick" id="quick"></div>
    <div class="composer">
      <textarea id="inp" rows="1" placeholder="메시지 입력…"></textarea>
      <button class="send" id="bSend" aria-label="보내기">↑</button>
    </div>
  </footer>
</div>
<div id="scrim"></div>
<aside id="drawer"><div class="dh">아르곤 RP <button class="icon" id="bCloseDrawer">✕</button></div><div class="ds" id="drawerBody"></div></aside>
<div id="sheet"><div class="box"><div class="sh"><span id="shTitle"></span><button class="icon" id="bCloseSheet">✕</button></div><div class="sb" id="shBody"></div><div class="sf" id="shFoot"></div></div></div>
<div id="viewer"></div>
<div id="toast"></div>
<input type="file" id="filePick" hidden>
<script>
"use strict";
/* ============ 기본값 ============ */
const DEFAULT_SYSTEM = `당신은 {{char}}를 연기하는 롤플레이 작가입니다. {{user}}와 함께 이야기를 만들어 갑니다.
- {{char}}와 장면 속 다른 인물만 연기합니다. {{user}}의 대사·행동·생각은 대신 쓰지 않습니다.
- 소설처럼 서술과 대사를 섞어 씁니다. 행동과 묘사는 서술로, 대사는 "큰따옴표"로 씁니다.
- 한국어로 씁니다. 한 응답은 3~6문단 정도로 합니다.
- 캐릭터 설정, 말투, 지금까지 일어난 일을 일관되게 유지합니다.
- {{user}}가 반응할 수 있는 지점에서 장면을 멈춥니다.`;

const TAG_SYSTEM = `You convert a roleplay scene into a NovelAI Diffusion V4/V4.5 prompt. Reply with ONLY a JSON object, no prose, no code fence:
{"base":"...","characters":[{"name":"...","tags":"..."}]}

TAG RULES (strict):
1. Danbooru tags only. lowercase, words separated by spaces (never underscores), tags separated by ", ". No sentences, no articles, no verbs in -ing form unless that exact tag exists (e.g. "sitting", "looking at viewer" are tags; "slowly walking toward him" is not).
2. Never write abstract or mood words that are not tags: no "tension", "emotional", "romantic atmosphere", "dramatic", "intense", "beautiful", "mysterious aura".
3. Use common tags with many danbooru posts. One tag per idea: no synonyms ("smile" OR "smiling", not both), no contradictions, no weights, no brackets, no "{}" or "::".
4. Do NOT write quality, aesthetic, rating or artist tags (masterpiece, best quality, very aesthetic, absurdres, artist:...). The app adds them.
5. Never put a character's name in tags. Hair, eyes, body and outfit come from the FIXED TAGS given below.

"base" (8-16 tags) in this order:
  people count: 1girl / 1boy / 2girls / 1girl, 1boy / no humans ... (add "solo" only when exactly one person is visible)
  framing: portrait / upper body / cowboy shot / full body / close-up, plus angle if clear: from side / from above / from below / from behind / pov
  place and background: indoors / outdoors / bedroom / classroom / forest / city street / night sky ...
  time and light: day / night / sunset / moonlight / backlighting / dim lighting / rain ...
  1-3 key props or effects that the text explicitly mentions.

"characters": one entry per visible character, at most 3, ordered left-to-right as they would appear.
  "name": the character name exactly as listed below (or a short label for an unlisted extra).
  "tags" (8-18 tags) in this order:
    the gender tag (girl / boy / woman / man),
    the character's FIXED TAGS copied exactly and in full,
    current outfit changes only if the scene states them (e.g. "jacket removed", "wet clothes"),
    expression (smile / blush / crying / angry / surprised / closed eyes / expressionless ...),
    gaze (looking at viewer / looking at another / looking away / looking down),
    pose and action (sitting / standing / lying / arms crossed / hand on own chest / holding cup ...).
  Actions between characters use NovelAI interaction prefixes: the actor gets "source#hug", the receiver gets "target#hug", both get "mutual#holding hands". Use the same action word on both sides.

DEPICTION:
- Show ONE frozen moment: the most visual beat of the LAST message. Only what the text states or clearly implies. Do not invent props, outfits or extra people.
- If {{user}} is the viewpoint character and not described, use "pov" in base and do not create an entry for them, unless they are physically interacting (then add them with only gender + their FIXED TAGS if given).
- If no person is visible, use "no humans" and an empty characters array.`;

const DEFAULT_SETTINGS = {
  gKey:"", gModel:"gemini-4-argon", gThinking:"", gTemp:"", gMaxTokens:8192, gSafety:"BLOCK_NONE", gContext:120, gStream:true,
  systemPrompt: DEFAULT_SYSTEM,
  cKey:"", cModel:"claude-sonnet-5-5",
  tagEngine:"claude", tagExtra:"",
  nKey:"", nModel:"nai-diffusion-4-5-full", nSize:"portrait", nSteps:28, nScale:5, nSampler:"k_euler_ancestral",
  nQuality:true, nUcPreset:0, nPrefix:"", nArtist:"", nNegative:"", nPreview:true, nAuto:false,
  corsProxy:"", fontSize:16
};
const SIZES = {portrait:[832,1216], landscape:[1216,832], square:[1024,1024]};

/* ============ 저장소 (IndexedDB) ============ */
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("argon-rp", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("img"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s);
    t.oncomplete = () => res(out && "result" in out ? out.result : out); t.onerror = () => rej(t.error); }); };
  return {
    get:(k, store="kv") => tx(store, "readonly", s => s.get(k)),
    set:(k, v, store="kv") => tx(store, "readwrite", s => s.put(v, k)),
    del:(k, store="kv") => tx(store, "readwrite", s => s.delete(k)),
    keys:(store="img") => tx(store, "readonly", s => s.getAllKeys()),
  };
})();

let S = null; // 전체 상태
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const run = () => DB.set("state", JSON.parse(JSON.stringify(S))).catch(e => toast("저장 실패: " + e.message));
  if (now) return run(); saveTimer = setTimeout(run, 400);
}
async function load() {
  let st = null; try { st = await DB.get("state"); } catch (e) { console.warn(e); }
  if (!st) st = { characters:[], chats:[], persona:{name:"나", desc:"", naiTags:""}, currentChatId:null, settings:{} };
  st.settings = Object.assign({}, DEFAULT_SETTINGS, st.settings || {});
  st.persona = Object.assign({name:"나", desc:"", naiTags:""}, st.persona || {});
  S = st;
  document.documentElement.style.setProperty("--fs", (S.settings.fontSize || 16) + "px");
}
const cfg = () => S.settings;
const curChat = () => S.chats.find(c => c.id === S.currentChatId) || null;
const charOf = chat => chat ? S.characters.find(c => c.id === chat.charId) : null;

/* ============ 유틸 ============ */
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k)); return e; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT; function toast(m, ms = 2600) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms); }
const macro = (s, ch) => String(s || "").replaceAll("{{char}}", ch?.name || "캐릭터").replaceAll("{{user}}", S.persona.name || "나");
function fmt(text) {
  const parts = String(text || "").replace(/\r/g, "").split(/\n{2,}|\n/).map(p => p.trim()).filter(Boolean);
  return parts.map(p => {
    let h = esc(p);
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
    h = h.replace(/(&quot;|“)(.+?)(&quot;|”)/g, "<q>“$2”</q>");
    return "<p>" + h + "</p>";
  }).join("");
}
const msgText = m => m.alts ? m.alts[m.idx] ?? "" : (m.text || "");
function setMsgText(m, t) { if (m.alts) m.alts[m.idx] = t; else m.text = t; }
// API 키에는 공백이 없다: 복사할 때 섞인 줄바꿈·보이지 않는 문자·따옴표·"Bearer " 접두어를 걷어낸다.
function cleanKey(k) { return String(k || "").replace(/^\s*(?:bearer\s+|x-api-key\s*:\s*)/i, "").replace(/[\s\u00A0\u00AD\u180E\u200B-\u200F\u2028-\u202F\u2060-\u206F\uFEFF]/g, "").replace(/^["'`]+|["'`]+$/g, ""); }
const keyPeek = k => k ? `${k.slice(0, 7)}…${k.slice(-4)} · ${k.length}자` : "(비어 있음)";
const KEY_FORMAT = { gKey:[/^AIza[0-9A-Za-z_-]{35}$/, "Gemini 키는 보통 AIza로 시작하는 39자예요"], cKey:[/^sk-ant-/, "Anthropic 키는 sk-ant-로 시작해요"], nKey:[/^pst-/, "NovelAI 영구 토큰은 pst-로 시작해요"] };
function keyWarn(name, k) { const f = KEY_FORMAT[name]; return k && f && !f[0].test(k) ? " ⚠ " + f[1] : ""; }
function proxied(url) { const p = (cfg().corsProxy || "").trim(); return p ? p + url : url; }
async function readErr(res) {
  let t = ""; try { t = await res.text(); } catch {}
  let msg = t; try { const j = JSON.parse(t); msg = j.error?.message || j.message || j.error || t; } catch {}
  if (typeof msg !== "string") msg = JSON.stringify(msg);
  return `HTTP ${res.status} ${msg.slice(0, 300)}`;
}
function netHint(e, who) {
  if (e.name === "AbortError") return "중단됨";
  if (e instanceof TypeError) return `${who} 서버에 연결하지 못했어요 (네트워크 또는 CORS 차단). 설정의 'CORS 프록시'를 확인하세요.`;
  return e.message || String(e);
}
const scrollEnd = () => { const m = $("#msgs"); requestAnimationFrame(() => m.scrollTop = m.scrollHeight); };

/* ============ Gemini ============ */
function buildGeminiRequest(chat, ch, extraUser) {
  const c = cfg();
  const sysParts = [macro(c.systemPrompt, ch)];
  if (ch) {
    sysParts.push(`[${ch.name} 설정]\n${macro(ch.desc, ch)}`);
    if (ch.scenario) sysParts.push(`[시나리오]\n${macro(ch.scenario, ch)}`);
    if (ch.examples) sysParts.push(`[예시 대화]\n${macro(ch.examples, ch)}`);
  }
  if (S.persona.desc) sysParts.push(`[${S.persona.name} 정보]\n${macro(S.persona.desc, ch)}`);
  if (chat.memo) sysParts.push(`[기억 메모 — 지금까지의 중요한 사실]\n${chat.memo}`);
  let msgs = chat.messages.filter(m => !m.error).slice(-Math.max(2, +c.gContext || 120));
  const contents = [];
  const push = (role, text) => { if (!text) return; const last = contents.at(-1);
    if (last && last.role === role) last.parts[0].text += "\n\n" + text; else contents.push({role, parts:[{text}]}); };
  for (const m of msgs) push(m.role === "user" ? "user" : "model", macro(msgText(m), ch));
  if (extraUser) push("user", extraUser);
  if (!contents.length || contents[0].role !== "user") contents.unshift({role:"user", parts:[{text:"(대화를 시작합니다)"}]});
  if (contents.at(-1).role !== "user") push("user", "(계속)");
  const gen = { maxOutputTokens: +c.gMaxTokens || 8192 };
  if (c.gTemp !== "" && !isNaN(+c.gTemp)) gen.temperature = +c.gTemp;
  if (c.gThinking) gen.thinkingConfig = { thinkingLevel: c.gThinking, includeThoughts: false };
  const cats = ["HARM_CATEGORY_HARASSMENT","HARM_CATEGORY_HATE_SPEECH","HARM_CATEGORY_SEXUALLY_EXPLICIT","HARM_CATEGORY_DANGEROUS_CONTENT"];
  return { systemInstruction:{parts:[{text:sysParts.join("\n\n")}]}, contents, generationConfig:gen,
    safetySettings: cats.map(category => ({category, threshold: c.gSafety || "BLOCK_NONE"})) };
}
function geminiText(j) {
  if (j.promptFeedback?.blockReason) throw new Error("Gemini가 요청을 차단했어요: " + j.promptFeedback.blockReason);
  const cand = j.candidates?.[0]; if (!cand) return { text:"", finish:null };
  const text = (cand.content?.parts || []).filter(p => !p.thought && typeof p.text === "string").map(p => p.text).join("");
  return { text, finish: cand.finishReason || null };
}
async function callGemini(body, onDelta, signal) {

}

async function unzipFirst(buf) {

  let e = -1; for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }

  else { off = 0; method = dv.getUint16(8, true); csize = dv.getUint32(18, true); }

  const data = u8.slice(start, start + csize);
  if (method === 0) return new Blob([data], {type:"image/png"});
  if (method !== 8) throw new Error("지원하지 않는 압축 방식: " + method);
  const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  return new Blob([out], {type:"image/png"});
}

async function testKeys(c) {

    if (c.nKey) { try {

        const r = await fetch(proxied("https://image.novelai.net/ai/generate-image"), {method:"POST", headers:{"content-type":"application/json", authorization:"Bearer " + c.nKey}, body:"{}"});
        if (r.status === 401 || r.status === 403) out.push("NovelAI ✗ 토큰 거부 · " + await readErr(r) + tag("nKey"));
        else out.push("NovelAI ✓ 연결·토큰 확인 (HTTP " + r.status + ")");

      data.images = {}; if (imgs.checked) for (const id of await DB.keys("img")) { const b = await DB.get(id, "img"); if (b) data.images[id] = await blobToB64(b); }
      data.app = "argon-rp"; data.ver = 1;
      download(`argon-rp-backup-${new Date().toISOString().slice(0, 10)}.json`, new Blob([JSON.stringify(data)], {type:"application/json"})); toast("백업 파일을 저장했어요"); }}, "백업 파일 만들기"),
    el("button", {class:"btn", style:"width:100%", onclick:() => pickFile("application/json,.json", async f => {
      try { const data = JSON.parse(await f.text()); if (data.app !== "argon-rp") throw new Error("아르곤 RP 백업 파일이 아니에요");
        if (!confirm("지금 데이터를 백업 내용으로 바꿀까요? (되돌릴 수 없어요)")) return;
        for (const [id, du] of Object.entries(data.images || {})) await DB.set(id, await (await fetch(du)).blob(), "img");
        const keep = {gKey:S.settings.gKey, cKey:S.settings.cKey, nKey:S.settings.nKey};
        delete data.images; delete data.app; delete data.ver; S = data; S.settings = Object.assign({}, DEFAULT_SETTINGS, S.settings);
        for (const k of Object.keys(keep)) if (!S.settings[k]) S.settings[k] = keep[k];
        await save(true); closeSheet(); renderMsgs(); toast("복원했어요");
      } catch (e) { toast("복원 실패: " + e.message, 5000); } })}, "백업 파일에서 복원")));
}
function exportChatText(chat) {
  const ch = charOf(chat);
  const txt = chat.messages.filter(m => !m.error).map(m => `${m.role === "user" ? S.persona.name : ch?.name}:\n${macro(msgText(m), ch)}`).join("\n\n---\n\n");
  download(`${ch?.name || "chat"}-${(chat.title || "대화").slice(0, 20)}.txt`, new Blob([txt], {type:"text/plain"}));
}
function b64ToUtf8(b64) { const bin = atob(b64.replace(/\s/g, "")); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
async function readPngCard(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf); let p = 8; const found = {};
  while (p + 8 <= u8.length) { const len = dv.getUint32(p); const type = String.fromCharCode(...u8.slice(p + 4, p + 8));
    if (type === "tEXt") { const d = u8.slice(p + 8, p + 8 + len); const z = d.indexOf(0); const key = new TextDecoder("latin1").decode(d.slice(0, z)); found[key] = new TextDecoder("latin1").decode(d.slice(z + 1)); }
    if (type === "IEND") break; p += 12 + len; }
  const raw = found.ccv3 || found.chara; if (!raw) throw new Error("PNG 안에 캐릭터 정보가 없어요");
  return JSON.parse(b64ToUtf8(raw));
}
function cardToChar(j, avatar) {
  const d = j.data || j;
  const desc = [d.description, d.personality ? "성격: " + d.personality : ""].filter(Boolean).join("\n\n");
  const conv = s => String(s || "").replace(/\{\{\s*char\s*\}\}|<BOT>/gi, "{{char}}").replace(/\{\{\s*user\s*\}\}|<USER>/gi, "{{user}}");
  return { id:uid(), name: d.name || "이름 없음", avatar, desc: conv(desc), scenario: conv(d.scenario), firstMes: conv(d.first_mes), altGreetings: (d.alternate_greetings || []).map(conv), examples: conv(d.mes_example), naiTags:"", extras:[] };
}
function importCard() {
  pickFile("image/png,application/json,.json,.png", async f => {
    try { let j, avatar = "";
      if (/\.png$/i.test(f.name) || f.type === "image/png") { j = await readPngCard(await f.arrayBuffer()); avatar = await shrinkImage(f, 256); }
      else j = JSON.parse(await f.text());
      const ch = cardToChar(j, avatar); S.characters.push(ch); save(); toast(`${ch.name} 가져왔어요. 삽화용 외형 태그를 채워 주세요.`, 4000); editChar(ch);
    } catch (e) { toast("가져오기 실패: " + e.message, 5000); } });
}

$("#inp").addEventListener("input", autosize);
$("#inp").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
$("#bSend").addEventListener("click", send);
$("#bMenu").addEventListener("click", openDrawer);
$("#bCloseDrawer").addEventListener("click", closeDrawer);
$("#scrim").addEventListener("click", closeDrawer);
$("#bChatMenu").addEventListener("click", chatMenu);
$("#bCloseSheet").addEventListener("click", closeSheet);
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
$("#viewer").addEventListener("click", () => $("#viewer").classList.remove("on"));
window.addEventListener("beforeunload", () => { if (saveTimer) { clearTimeout(saveTimer); DB.set("state", JSON.parse(JSON.stringify(S))); } });
document.addEventListener("visibilitychange", () => { if (document.hidden && S) save(true); });
load().then(() => { renderMsgs(); scrollEnd(); if (navigator.storage?.persist) navigator.storage.persist().catch(() => {}); });
